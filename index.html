<html>
  <head>
    <title>RobotSimulator</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js"></script>
  </head>
  <body class="dashboard-container">
    <section class="banner banner__temperature banner--danger">
      <p class="banner__temperature-text banner__temperature-text--danger">Overheated at 80°C ━ cooling down, motor locked</p>
    </section>
    <section class="banner banner__battery">
      <p class="banner__battery-text">Low battery ━ --% remaining</p>
    </section>
    <header class="header">
      <img src="RoboIcon.png" alt="dashboard-icon" class="header__icon" />
      <h1 class="header__title">Robot Telemetry Dashboard</h1>
    </header>
    <main>
      <section class="status-cards">
        <div class="card">
          <h3>Battery</h3>
          <p><span class="card__battery">--%</span></p>
          <div class="bar card__bar">
            <div class="bar__fill"></div>
          </div>
        </div>
        <div class="card">
          <h3>Motor Speed</h3>
          <span class="card__speed-value"></span>
          <p class="card__speed-text">RPM</p>
        </div>
        <div class="card">
          <h3>Temperature</h3>
          <p><span class="card__temperature">--</span>°C</p>
        </div>
        <div class="card">
          <h3>Motor Status</h3>
          <div class="card__status card__status--running">
            <span class="circle circle--running"></span>
            <span class="card__status-text">Running</span>
          </div>
        </div>
      </section>
      <section class="chart-layout">
        <div class="chart-card chart-card--speed">
          <p>Motor speed over time</p>
          <img src="ChartPlaceholder.png" alt="motor-speed-chart" class="chart" />
        </div>
        <div class="chart-card chart-card--temperature">
          <p>Temperature over time</p>
          <img src="ChartPlaceholder.png" alt="motor-temperature-chart" class="chart" />
        </div>
      </section>
      <section class="control-panel">
        <h4>Control Panel</h4>
        <button class="btn btn--stop js-motor-btn">Stop motor</button>
        <button class="btn btn--ready js-charge-btn" disabled>Charge</button>
        <span class="control-panel__state-text">Motor is running. Stop motor before charging.</span>
      </section>
    </main>
  </body>
</html>
