<html>
  <head>
    <title>RobotSimulator</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="dashboard-header">
      <h1>
        <img src="RoboIcon.png" alt="dashboard-icon" id="dashboard-icon" />
        Robot Telemetry Dashboard
      </h1>
    </div>
    <div class="status-cards">
      <div class="card">
        <p>Battery</p>
        <p><span class="battery-card-value">72%</span></p>
        <div class="progress-track">
          <div class="progress-fill-battery-green"></div>
        </div>
      </div>
      <div class="card">
        <p>Motor Speed</p>
        <p><span class="motors-speed-card">1,134</span>RPM</p>
      </div>
      <div class="card">
        <p>Temperature</p>
        <p><span class="temperature-card">34</span>°C</p>
      </div>
      <div class="card">
        <p>Motor Status</p>
        <div class="motor-status-card">
          <ul class="green-button">
            <li>Running</li>
          </ul>
        </div>
      </div>
    </div>
  </body>
</html>
