<html>
  <head>
    <title>RobotSimulator</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="dashboard-header">
      <h1>
        <img src="RoboIcon.png" alt="dashboard-icon" id="dashboard-icon" />
        Robot Telemetry Dashboard
      </h1>
    </div>
    <div class="status-cards">
      <div class="card">
        Battery
        <div class="battery-card"></div>
      </div>
      <div class="card">
        Motor Speed
        <div class="motors-speed-card"></div>
      </div>
      <div class="card">
        Temperature
        <div class="temperature-card"></div>
      </div>
      <div class="card">
        Motor Status
        <div class="motor-status-card"></div>
      </div>
    </div>
  </body>
</html>
