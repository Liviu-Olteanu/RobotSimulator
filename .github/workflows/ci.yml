name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npx eslint .

  deploy-production:
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://robotsimulator-prod-bbgxedbccybwg8dh.polandcentral-01.azurewebsites.net

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: robotsimulator-prod
          publish-profile: ${{ secrets.AZURE_PROD_PUBLISH_PROFILE }}
          package: .

  deploy-preview:
    needs: lint
    if: github.event_name == 'pull_request'
    concurrency: preview
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://robotsimulator-preview-gbdgb4dyd4dcbddy.polandcentral-01.azurewebsites.net

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: robotsimulator-preview
          publish-profile: ${{ secrets.AZURE_PREVIEW_PUBLISH_PROFILE }}
          package: .
